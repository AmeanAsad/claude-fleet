[project]
name = "claude-fleet"
version = "0.1.0"
description = "CLI + TUI for orchestrating long-running Claude Code instances on cloud VMs or local containers"
requires-python = ">=3.11"
dependencies = [
    "typer",
    "rich",
    "textual",
    "pyyaml",
    "pydantic",
    "pulumi",
    "pulumi-azure-native",
    "pulumi-gcp",
    "watchfiles",
    "fastapi",
    "uvicorn[standard]",
    "sse-starlette",
    "claude-code-sdk",
    "httpx",
    "websockets",
    "PyJWT[crypto]",
]

[project.scripts]
cfleet = "cfleet.cli:app"
cfleet-gh-token = "cfleet.credential_helper:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfleet"]

[tool.hatch.build.targets.wheel.force-include]
"src/cfleet/infra_pulumi" = "cfleet/infra_pulumi"
"src/cfleet/defaults" = "cfleet/defaults"
"src/cfleet/devcontainer" = "cfleet/devcontainer"
"web/out" = "cfleet/web_out"
